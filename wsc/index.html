<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 외부 연결·폼 전송을 모두 막는다. 진행 기록은 이 휴대폰 브라우저에만 남는다. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src mediastream: blob:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f1b3d">
<link rel="icon" href="data:,">
<title>위대한 만남</title>
<style>
  /* 배치: 위에 늘 보이는 '비밀 코드 자물쇠'(G R E A T 다섯 칸), 그 아래 본부 화면 또는 연구실 문제 화면 */
  :root {
    --bg: #eef1f7;
    --surface: #ffffff;
    --ink: #121a33;
    --muted: #55607a;
    --line: #d5dbe8;
    --navy: #0f1b3d;        /* 회의 본부 */
    --navy-ink: #f4f1e6;
    --gold: #c8912a;        /* 코드 글자 */
    --gold-soft: #f6ead0;
    --red: #b3263a;         /* 크리스마스 */
    --ok: #1f7a4d;
    --ok-soft: #e2f3ea;
    --bad: #b3263a;
    --bad-soft: #fbe6e9;
    --slot-empty: #1c2a55;
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --font-code: ui-monospace, "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1024; --surface: #131c38; --ink: #eef0f7; --muted: #a3acc4; --line: #26315a;
      --navy: #070c1c; --navy-ink: #f4f1e6; --gold: #e6b450; --gold-soft: #3a2f17; --red: #e0566b;
      --ok: #5cc98f; --ok-soft: #123526; --bad: #f07386; --bad-soft: #3d1620; --slot-empty: #1a2547;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  /* 본부 머리 */
  .hq { background: var(--navy); color: var(--navy-ink); padding-top: env(safe-area-inset-top, 0px); }
  .hq .wrap { padding-block: 20px 22px; display: grid; gap: 14px; }
  .eyebrow { margin: 0; font-size: 0.72rem; letter-spacing: 0.18em; font-weight: 700; color: var(--gold); }
  .hq h1 { margin: 0; font-size: 1.7rem; line-height: 1.25; letter-spacing: -0.01em; }
  .hq h1 a { color: inherit; text-decoration: none; }
  .lock { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
  .slot { display: grid; gap: 4px; justify-items: center; }
  .slot b {
    width: 100%; aspect-ratio: 4 / 5; max-width: 72px; display: grid; place-items: center;
    border-radius: 10px; background: var(--slot-empty); color: #5d6a96;
    font-family: var(--font-code); font-size: 1.9rem; font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .slot.on b { background: var(--gold); color: var(--navy); box-shadow: 0 0 0 2px rgba(255,255,255,0.15), 0 6px 18px rgba(200,145,42,0.35); }
  .slot.new b { animation: pop 0.7s cubic-bezier(.2,1.6,.4,1) both; }
  .slot small { font-size: 0.7rem; color: #b9c0d8; white-space: nowrap; }
  @keyframes pop { 0% { transform: scale(0.3) rotate(-12deg); opacity: 0; } 100% { transform: none; opacity: 1; } }

  main.wrap { padding-block: 18px 40px; display: grid; gap: 16px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 10px; }
  .card h2 { margin: 0; font-size: 1.2rem; line-height: 1.35; }
  .card p { margin: 0; }
  .muted { color: var(--muted); font-size: 0.92rem; }
  .notice { border-radius: 10px; padding: 10px 12px; background: var(--bad-soft); color: var(--bad); font-size: 0.9rem; }

  /* 연구실 목록 */
  .labs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .labs li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
  .labs .chip-letter { width: 44px; height: 52px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-code); font-weight: 700; font-size: 1.3rem; background: var(--bg); color: var(--muted); border: 1px dashed var(--line); }
  .labs li.done .chip-letter { background: var(--gold); color: var(--navy); border: 0; }
  .labs .who { font-weight: 700; }
  .labs .where { font-size: 0.85rem; color: var(--muted); }
  .state { font-size: 0.78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; }
  .done .state { background: var(--ok-soft); color: var(--ok); }

  /* 연구실 문제 */
  .lab-head { display: grid; gap: 2px; }
  .lab-head .eyebrow { color: var(--red); }
  .place { font-size: 0.85rem; color: var(--muted); }
  .q { font-weight: 700; font-size: 1.08rem; padding-top: 6px; border-top: 1px solid var(--line); }
  .choices { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .choices button {
    width: 100%; text-align: left; font: inherit; color: var(--ink); background: var(--bg);
    border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer;
    display: grid; grid-template-columns: 1.8em minmax(0, 1fr); gap: 6px; align-items: start; min-height: 52px;
  }
  .choices button .n { font-weight: 700; color: var(--muted); }
  .choices button:active { transform: scale(0.99); }
  .choices button.wrong { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .choices button.wrong .n { color: var(--bad); }
  .choices button.right { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); font-weight: 700; }
  .choices button[disabled] { cursor: default; }
  .shake { animation: shake 0.4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .feedback { border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
  .feedback.bad { background: var(--bad-soft); color: var(--bad); }

  .reward { text-align: center; justify-items: center; background: var(--navy); color: var(--navy-ink); border: 0; }
  .reward .eyebrow { color: var(--gold); }
  .big-letter {
    width: 108px; height: 132px; border-radius: 16px; display: grid; place-items: center;
    background: var(--gold); color: var(--navy); font-family: var(--font-code); font-weight: 800; font-size: 4.2rem;
    animation: pop 0.8s cubic-bezier(.2,1.6,.4,1) both; box-shadow: 0 10px 30px rgba(200,145,42,0.4);
  }
  .reward p { color: #d9dcea; }
  .explain { text-align: left; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 10px 12px; font-size: 0.92rem; }

  .btn {
    display: inline-flex; justify-content: center; align-items: center; gap: 6px; font: inherit; font-weight: 700;
    padding: 12px 18px; border-radius: 12px; border: 0; background: var(--red); color: #fff; text-decoration: none; cursor: pointer; min-height: 48px;
  }
  .btn.ghost { background: transparent; color: inherit; border: 1.5px solid currentColor; }
  .btn.small { padding: 8px 12px; min-height: 40px; font-size: 0.9rem; }
  .btn:focus-visible, .choices button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* 완성 · 안내데스크 */
  .complete { background: var(--navy); color: var(--navy-ink); border: 0; text-align: center; }
  .complete .code { font-family: var(--font-code); font-weight: 800; font-size: 3rem; letter-spacing: 0.25em; color: var(--gold); margin-right: -0.25em; }
  .complete p { color: #d9dcea; }
  .desk { border: 2px solid var(--gold); }
  .clock { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px; border-radius: 10px; background: var(--gold-soft); font-family: var(--font-code); font-variant-numeric: tabular-nums; font-size: 1.25rem; font-weight: 700; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.25; transform: scale(0.6); } }
  .claims { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .claims li { display: grid; gap: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); }
  .claims .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .claims .name { font-weight: 700; }
  .claims .st { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  .claims .st.ok { color: var(--ok); }
  .claims .st.wait { color: var(--gold); }
  .confirm { display: grid; gap: 8px; padding: 10px; border-radius: 10px; background: var(--bg); font-size: 0.9rem; }
  footer.wrap { padding-block: 0 32px; color: var(--muted); font-size: 0.8rem; text-align: center; }

  /* 맨 아래 고정 탭: 카메라 켜기 */
  body { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--navy); border-top: 1px solid rgba(255,255,255,0.08);
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .tabbar button {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 528px; margin: 0 auto;
    min-height: 56px; border: 0; border-radius: 14px; background: var(--gold); color: var(--navy);
    font: inherit; font-size: 1.08rem; font-weight: 800; cursor: pointer;
  }
  .tabbar button:focus-visible { outline: 3px solid var(--navy-ink); outline-offset: 2px; }
  .tabbar svg { width: 26px; height: 26px; flex: none; }

  /* QR 스캐너 */
  .scanner { position: fixed; inset: 0; z-index: 30; background: #000; color: #fff; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
  .scanner[hidden] { display: none; }
  .scan-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); }
  .scan-top strong { font-size: 1.05rem; }
  .scan-close { font: inherit; font-weight: 700; color: #fff; background: rgba(255,255,255,0.16); border: 0; border-radius: 999px; padding: 8px 16px; min-height: 44px; cursor: pointer; }
  .scan-view { position: relative; overflow: hidden; }
  .scan-view video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scan-frame {
    position: absolute; left: 50%; top: 50%; width: min(70vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%);
    border-radius: 20px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.45); border: 3px solid var(--gold);
  }
  .scan-frame.hit { border-color: #5cc98f; }
  .scan-bottom { padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); text-align: center; display: grid; gap: 6px; }
  .scan-msg { margin: 0; font-weight: 700; }
  .scan-sub { margin: 0; font-size: 0.85rem; color: #c9cede; }
  .scan-msg.warn { color: #ffb4be; }
  .scan-msg.ok { color: #8fe0b5; }
  footer button { font: inherit; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="hq">
  <div class="wrap">
    <p class="eyebrow">WORLD SCIENCE CONGRESS 2026</p>
    <h1><a href="index.html" id="home-link">위대한 만남</a></h1>
    <ol class="lock" id="lock" aria-label="모은 비밀 코드"></ol>
  </div>
</header>
<main class="wrap" id="view"></main>
<footer class="wrap" id="footer"></footer>

<nav class="tabbar" aria-label="바로가기">
  <button type="button" id="camera-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
    카메라 켜기
  </button>
</nav>

<div class="scanner" id="scanner" role="dialog" aria-modal="true" aria-labelledby="scan-title" hidden>
  <div class="scan-top">
    <strong id="scan-title">QR 코드 찍기</strong>
    <button type="button" class="scan-close" id="scan-close">닫기</button>
  </div>
  <div class="scan-view">
    <video id="scan-video" playsinline muted autoplay></video>
    <div class="scan-frame" id="scan-frame" aria-hidden="true"></div>
  </div>
  <div class="scan-bottom">
    <p class="scan-msg" id="scan-msg" role="status">카메라를 켜는 중이에요…</p>
    <p class="scan-sub" id="scan-sub">전시품 앞의 미션 QR을 네모 안에 비춰 주세요.</p>
  </div>
</div>

    for (var i = 0; i < LABS.length; i++) if (LABS[i].id === id) return LABS[i];
    return null;

  // 32비트 FNV-1a 해시 (UTF-8 바이트 기준)
  function hash(text) {
    var bytes = unescape(encodeURIComponent(text));
    var h = 0x811c9dc5;

      h ^= bytes.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;

    return ("0000000" + h.toString(16)).slice(-8);

  function checkAnswer(labId, choiceIndex) {

    return hash("wsc2026|" + labId + "|" + choiceIndex) === lab.answerHash;
  }

  // ---------- 진행 상황 ----------
  // { v: 1, found: { labId: 획득시각(ms) }, completedAt: ms|null, claims: { calendar: ms|null, draw: ms|null } }
  function emptyProgress() {
    return { v: 1, found: {}, completedAt: null, claims: { calendar: null, draw: null } };
  }

  function isTime(v) { return typeof v === "number" && isFinite(v) && v > 0; }

  // 저장된 글을 읽는다. 깨졌거나 모르는 값은 버리고 빈 진행 상황에서 시작한다.
  function parseProgress(text) {
    var p = emptyProgress();
    if (!text) return p;
    var raw;
    try { raw = JSON.parse(text); } catch (e) { return p; }
    if (!raw || typeof raw !== "object" || raw.v !== 1) return p;
    if (raw.found && typeof raw.found === "object") {
      for (var i = 0; i < LABS.length; i++) {

    if (raw.claims && typeof raw.claims === "object") {

  function clone(p) { return parseProgress(serialize(p)); }

  function foundCount(p) {

    for (var i = 0; i < LABS.length; i++) if (p.found[LABS[i].id]) n++;
    return n;
  }

  function isComplete(p) { return foundCount(p) === LABS.length; }

  function latestFound(p) {
    var m = 0;
    for (var k in p.found) if (p.found[k] > m) m = p.found[k];
    return m || null;
  }

  // 정답을 맞혔을 때 글자를 기록한다. 이미 받은 연구실은 처음 받은 시각을 유지한다.
  function collect(p, labId, now) {
    var next = clone(p);
    if (!findLab(labId)) return next;
    if (!next.found[labId]) next.found[labId] = now;
    if (isComplete(next) && !next.completedAt) next.completedAt = now;
    return next;
  }

  // GREAT 순서대로 받은 글자(못 받은 칸은 null)
  function slots(p) {
    return LABS.map(function (lab) { return p.found[lab.id] ? lab.letter : null; });
  }

  // 안내데스크 수령 가능 여부: calendar는 글자 1개 이상, draw는 GREAT 완성. 한 번만.
  function canClaim(p, kind) {
    if (kind === "calendar") return foundCount(p) >= 1 && !p.claims.calendar;
    if (kind === "draw") return isComplete(p) && !p.claims.draw;
    return false;
  }

  function claim(p, kind, now) {
    var next = clone(p);
    if (canClaim(next, kind)) next.claims[kind] = now;
    return next;
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  // 예: "12월 25일 14:03:09"
  function formatTime(ms, withSeconds) {
    var d = new Date(ms);
    var s = (d.getMonth() + 1) + "월 " + d.getDate() + "일 " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());

    var bases = [BASE];

    var path = url.origin + url.pathname;

      var bp = bu.origin + bu.pathname;

    });

    var lab = url.searchParams.get("lab");
    if (lab === null) return { type: "home" };

  return {
    BASE: BASE, parseScan: parseScan,
    CODE: CODE, LABS: LABS, findLab: findLab, hash: hash, checkAnswer: checkAnswer,
    emptyProgress: emptyProgress, parseProgress: parseProgress, serialize: serialize,

<!-- 화면: 주소의 ?lab=… 에 따라 본부 화면 또는 연구실 문제 화면을 그린다. -->
<script>

      h("p", { class: "muted", text: "순서는 자유예요. 전시품 앞의 QR을 찍고 문제를 맞히면 코드 글자를 하나씩 받아요. 틀려도 바로 다시 풀 수 있어요." }),

  // ---------- 안내데스크 확인 ----------

    clearInterval(clockTimer);

      if (can) {
        if (pendingClaim === c.kind) {

  }

  function prepareDecoder() {
    // 휴대폰 브라우저에 QR 판독 기능이 있으면 쓰고, 없으면 같은 폴더의 판독기(jsQR)를 불러온다.
    if (!detector && "BarcodeDetector" in window) {
      return window.BarcodeDetector.getSupportedFormats().then(function (f) {
        if (f.indexOf("qr_code") >= 0) detector = new window.BarcodeDetector({ formats: ["qr_code"] });
        else return loadJsQR();
      }).catch(loadJsQR);
    }
    return detector ? Promise.resolve() : loadJsQR();
  }

  function decodeFrame() {
    if (detector) {
      return detector.detect(video).then(function (codes) { return codes.length ? codes[0].rawValue : null; });
    }
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) return Promise.resolve(null);
    var scale = Math.min(1, 720 / Math.max(vw, vh));
    var w = Math.round(vw * scale), hh = Math.round(vh * scale);
    canvas = canvas || document.createElement("canvas");
    canvas.width = w; canvas.height = hh;
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, hh);
    var img = ctx.getImageData(0, 0, w, hh);
    var code = window.jsQR(img.data, w, hh, { inversionAttempts: "dontInvert" });
    return Promise.resolve(code ? code.data : null);
  }

  function loop(now) {
    if (!scanning) return;
    if (now - lastTry < 180 || video.readyState < 2) { requestAnimationFrame(loop); return; }
    lastTry = now;
    decodeFrame().then(function (text) {
      if (!scanning) return;
      if (text !== null) {
        var r = W.parseScan(text, location.href);
        if (r.type === "lab" || r.type === "home") {
          var lab = r.type === "lab" ? W.findLab(r.id) : null;
          frameEl.classList.add("hit");
          setMsg(lab ? lab.scientist + " 연구실 QR을 찾았어요!" : "미션 본부 QR을 찾았어요!", "ok", "이동하는 중이에요…");
          stopCamera();
          setTimeout(function () { location.href = lab ? "index.html?lab=" + lab.id : "index.html"; }, 350);
          return;
        }
        setMsg("미션 QR이 아니에요", "warn", "전시품 앞에 붙은 'WORLD SCIENCE CONGRESS' QR을 비춰 주세요.");
        warnUntil = performance.now() + 2500;
      } else if (warnUntil && performance.now() > warnUntil) {
        warnUntil = 0;
        setMsg("QR을 찾는 중이에요", "", "전시품 앞의 미션 QR을 네모 안에 비춰 주세요.");
      }
      requestAnimationFrame(loop);
    }).catch(function () { if (scanning) requestAnimationFrame(loop); });
  }

  function cameraError(err) {
    var name = err && err.name;
    if (name === "NotAllowedError" || name === "SecurityError") {
      setMsg("카메라 사용이 허용되지 않았어요", "warn", "주소창 옆 설정에서 카메라를 허용한 뒤 다시 눌러 주세요. 또는 휴대폰 기본 카메라 앱으로 QR을 비춰도 돼요.");
    } else if (name === "NotFoundError" || name === "OverconstrainedError") {
      setMsg("사용할 수 있는 카메라가 없어요", "warn", "휴대폰 기본 카메라 앱으로 QR을 비춰 주세요.");
    } else {
      setMsg("카메라를 켤 수 없어요", "warn", "휴대폰 기본 카메라 앱으로 QR을 비춰 주세요.");
    }
  }

  function openScanner() {
    scanner.hidden = false;
    document.body.style.overflow = "hidden";
    frameEl.classList.remove("hit");
    setMsg("카메라를 켜는 중이에요…", "", "전시품 앞의 미션 QR을 네모 안에 비춰 주세요.");
    document.getElementById("scan-close").focus();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { cameraError(null); return; }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } }, audio: false })
      .then(function (s) {
        if (scanner.hidden) { s.getTracks().forEach(function (t) { t.stop(); }); return; }
        stream = s;
        video.srcObject = s;
        var p = video.play(); if (p && p.catch) p.catch(function () {});
        return prepareDecoder().then(function () {
          if (scanner.hidden) return;
          setMsg("QR을 찾는 중이에요", "");
          scanning = true; lastTry = 0;
          requestAnimationFrame(loop);
        }, function () { setMsg("QR 판독기를 불러오지 못했어요", "warn", "인터넷 연결을 확인하거나 휴대폰 기본 카메라 앱으로 QR을 비춰 주세요."); });
      })
      .catch(cameraError);
  }

  function stopCamera() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
    video.srcObject = null;
  }

  function closeScanner() {
    stopCamera();
    scanner.hidden = true;
    document.body.style.overflow = "";
    camBtn.focus();
  }

  camBtn.addEventListener("click", openScanner);
  document.getElementById("scan-close").addEventListener("click", closeScanner);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !scanner.hidden) closeScanner(); });
  document.addEventListener("visibilitychange", function () { if (document.hidden && !scanner.hidden) closeScanner(); });
  window.addEventListener("pagehide", stopCamera);

  // 다른 탭에서 기록이 바뀌면 맞춘다
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    progress = load(); renderLock(null);
    if (id === null) renderHome();
  });
})();
</script>
</body>
</html>
