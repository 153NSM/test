<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설문 집계기</title>
</head>
<body>
<!-- 계산 로직: 화면(DOM)과 무관한 순수 함수. test/core.test.js가 이 블록만 꺼내 시험한다. -->
<script id="survey-core">
var SurveyCore = (function () {
  "use strict";

  // 엑셀 복사 형식(탭·줄바꿈 구분, 큰따옴표 감싸기)을 줄 배열로 바꾼다.
  function parseTSV(text) {
    var rows = [];
    var row = [];
    var cell = "";
    var i = 0;
    var n = text.length;
    var atCellStart = true;

    while (i < n) {
      var ch = text[i];
      if (atCellStart && ch === '"') {
        // 큰따옴표로 감싼 칸: 닫는 따옴표까지 읽고, "" 는 " 로 바꾼다.
        var j = i + 1;
        var buf = "";
        var closed = false;
        while (j < n) {
          if (text[j] === '"') {
            if (text[j + 1] === '"') { buf += '"'; j += 2; continue; }
            closed = true; j += 1; break;
          }
          buf += text[j]; j += 1;
        }
        var next = text[j];
        if (closed && (j >= n || next === "\t" || next === "\n" || next === "\r")) {
          cell = buf; i = j; atCellStart = false; continue;
        }
        // 올바르게 감싼 칸이 아니면 따옴표를 그냥 글자로 취급한다.
      }
      atCellStart = false;
      if (ch === "\t") {
        row.push(cell); cell = ""; atCellStart = true; i += 1;
      } else if (ch === "\r" || ch === "\n") {
        row.push(cell); rows.push(row); row = []; cell = ""; atCellStart = true;
        i += (ch === "\r" && text[i + 1] === "\n") ? 2 : 1;
      } else {
        cell += ch; i += 1;
      }
    }
    if (!atCellStart || cell !== "" || row.length > 0) {
      row.push(cell); rows.push(row);
    }
    // 입력 끝에 붙은 빈 줄은 줄로 세지 않는다.
    while (rows.length > 0) {
      var last = rows[rows.length - 1];
      if (last.length === 1 && last[0] === "") rows.pop(); else break;
    }
    return rows;
  }

  // 칸 판정: "valid"(값 1~5) / "blank"(빈 응답) / "excluded"(제외)
  function classifyCell(raw) {
    var v = raw == null ? "" : String(raw).trim();
    if (v === "") return { kind: "blank" };
    if (v.length === 1 && v >= "1" && v <= "5") return { kind: "valid", value: Number(v) };
    return { kind: "excluded" };
  }

  // 평균을 소수 셋째 자리에서 반올림해 둘째 자리까지. 정수 연산으로 오차 없이 계산한다.
  function formatAverage(sum, count) {
    if (!count) return "-";
    var hundredths = Math.floor((sum * 200 + count) / (2 * count));
    var whole = Math.floor(hundredths / 100);
    var frac = hundredths % 100;
    return whole + "." + (frac < 10 ? "0" : "") + frac;
  }

  // 붙여넣은 글 전체를 문항별 결과로 집계한다.
  function aggregate(text) {
    var rows = parseTSV(String(text == null ? "" : text));
    if (rows.length === 0) return { questions: [], responseCount: 0, error: "empty" };
    var header = rows[0];
    if (header.length < 2) return { questions: [], responseCount: rows.length - 1, error: "no-questions" };

    var questions = [];
    for (var c = 1; c < header.length; c++) {
      var name = header[c].trim();
      questions.push({ name: name === "" ? "(" + (c + 1) + "열)" : name, valid: 0, sum: 0, blank: 0, excluded: 0 });
    }
    for (var r = 1; r < rows.length; r++) {
      var row = rows[r];
      for (var q = 0; q < questions.length; q++) {
        var col = q + 1;
        var res = classifyCell(col < row.length ? row[col] : "");
        var item = questions[q];
        if (res.kind === "valid") { item.valid += 1; item.sum += res.value; }
        else if (res.kind === "blank") item.blank += 1;
        else item.excluded += 1;
      }
    }
    for (var k = 0; k < questions.length; k++) {
      questions[k].average = formatAverage(questions[k].sum, questions[k].valid);
    }
    return { questions: questions, responseCount: rows.length - 1, error: null };
  }

  return { parseTSV: parseTSV, classifyCell: classifyCell, formatAverage: formatAverage, aggregate: aggregate };
})();
</script>
</body>
</html>
